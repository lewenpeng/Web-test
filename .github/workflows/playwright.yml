name: Playwright E2E Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: Remote project to test
        required: true
        default: runoob
        type: choice
        options:
          - runoob
          - govee-community
          - all

  push:
    branches:
      - main

  schedule:
    # GitHub cron uses UTC; this runs daily at 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  playwright:
    name: ${{ matrix.target }} Chromium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target != 'all' && format('["{0}"]', inputs.target) || github.event_name == 'schedule' && vars.SCHEDULE_TARGETS_JSON || '["runoob","govee-community"]') }}

    env:
      CI: "true"
      TARGET: ${{ matrix.target }}
      GOVEE_TEST_EMAIL: ${{ secrets.GOVEE_TEST_EMAIL }}
      GOVEE_TEST_PASSWORD: ${{ secrets.GOVEE_TEST_PASSWORD }}
      QQ_IMAP_AUTH_CODE: ${{ secrets.QQ_IMAP_AUTH_CODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.target }} tests
        run: npm run test:e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.target }}-${{ github.run_number }}
          path: |
            playwright-report/${{ matrix.target }}/
            test-results/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
